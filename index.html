    <!--
      Analytics is consent-gated. Nothing from Google loads and no cookie is
      set until the visitor accepts. The banner in App.jsx calls

    -->
    <script>
      (function () {
        var KEY = "xb_cookie_consent";
        var GA_ID = "G-VDY54H7EXK";
        var loaded = false;

        function load() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag("js", new Date());
          window.gtag("config", GA_ID, { anonymize_ip: true });
        }

        function read() {
          try { return localStorage.getItem(KEY); } catch (e) { return null; }
        }

        window.xbConsent = {
          status: read(),
          accept: function () {
            try { localStorage.setItem(KEY, "accepted"); } catch (e) {}
            this.status = "accepted";
            load();
          },
          decline: function () {
            try { localStorage.setItem(KEY, "declined"); } catch (e) {}
            this.status = "declined";
          }
        };

        if (window.xbConsent.status === "accepted") load();
      })();
    </script>
